<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODE99™</title>
<meta name="description" content="CODE99 — Innovation Beyond Limits. Fragrances & Software.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Space+Grotesk:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --card: #111111;
    --border: #1a1a1a;
    --border-h: #2a2a2a;
    --fg: #ffffff;
    --muted: #666666;
    --accent: #c8a97e;
    --accent2: #3b82f6;
    --glow: rgba(200,169,126,0.15);
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .noise {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 999;
  }

  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 40px 24px;
    position: relative;
  }

  .hero::before {
    content: '';
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
    pointer-events: none;
  }

  .brand {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: clamp(48px, 10vw, 120px);
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--fg);
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }

  .brand .tm {
    font-size: 0.25em;
    vertical-align: super;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-left: 4px;
  }

  .tagline {
    font-size: clamp(14px, 2vw, 18px);
    color: var(--muted);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin-bottom: 60px;
    position: relative;
    z-index: 1;
    font-weight: 300;
  }

  .buttons {
    display: flex; gap: 20px;
    position: relative; z-index: 1;
    flex-wrap: wrap; justify-content: center;
  }

  .btn {
    display: flex; flex-direction: column; align-items: center;
    min-width: 260px; padding: 40px 48px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-decoration: none; color: var(--fg);
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    cursor: pointer;
    position: relative; overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0; transition: opacity 0.4s;
  }

  .btn:hover { border-color: var(--border-h); transform: translateY(-6px); }
  .btn:hover::before { opacity: 1; }

  .btn-icon {
    font-size: 40px; margin-bottom: 18px;
    filter: grayscale(0.2);
    transition: filter 0.3s, transform 0.3s;
  }

  .btn:hover .btn-icon { filter: grayscale(0); transform: scale(1.1); }

  .btn-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }

  .btn-sub {
    font-size: 12px; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase;
  }

  .btn-software .btn-sub { color: var(--accent); }
  .btn-fragrance .btn-sub { color: var(--muted); }

  .btn-fragrance:hover .btn-sub { color: var(--fg); }

  .divider {
    width: 60px; height: 1px;
    background: var(--border);
    margin: 40px auto 0;
    position: relative; z-index: 1;
  }

  .footer {
    position: absolute; bottom: 30px;
    width: 100%; text-align: center;
    color: var(--muted); font-size: 12px;
    letter-spacing: 0.1em;
  }

  .footer a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .footer a:hover { color: var(--accent); }

  /* Coming Soon Overlay */
  .overlay {
    display: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(20px);
    z-index: 1000;
    align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .overlay.active { display: flex; opacity: 1; }

  .overlay-box {
    text-align: center;
    padding: 60px 40px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    max-width: 440px;
    position: relative;
  }

  .overlay-box .close-btn {
    position: absolute; top: 16px; right: 20px;
    background: none; border: none; color: var(--muted);
    font-size: 24px; cursor: pointer;
    transition: color 0.2s;
  }

  .overlay-box .close-btn:hover { color: var(--fg); }

  .overlay-box h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px; margin-bottom: 12px;
  }

  .overlay-box p {
    color: var(--muted); font-size: 15px;
    line-height: 1.7;
  }

  .overlay-box .timer {
    margin-top: 24px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px; color: var(--accent);
    letter-spacing: 0.15em;
  }

  @media (max-width: 600px) {
    .buttons { flex-direction: column; align-items: center; }
    .btn { min-width: 280px; }
  }
</style>
</head>
<body>

<div class="noise"></div>

<section class="hero">
  <h1 class="brand">C O D E 9 9<span class="tm">™</span></h1>
  <p class="tagline">Innovation Beyond Limits</p>

  <div class="buttons">
    <a class="btn btn-fragrance" onclick="showComingSoon()">
      <span class="btn-icon">🧴</span>
      <span class="btn-label">Fragrances</span>
      <span class="btn-sub">Coming Soon</span>
    </a>

    <a href="software.html" class="btn btn-software">
      <span class="btn-icon">💻</span>
      <span class="btn-label">Software</span>
      <span class="btn-sub">Explore Now →</span>
    </a>
  </div>

  <div class="divider"></div>

  <p class="footer">
    &copy; 2026 CODE99 &mdash;
    <a href="mailto:info@code99.pk">info@code99.pk</a>
  </p>
</section>

<div class="overlay" id="comingSoon" onclick="closeOverlay(event)">
  <div class="overlay-box" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="closeOverlay()">&times;</button>
    <h2>🧴 Coming Soon</h2>
    <p>CODE99 Fragrances launch hone wala hai. Premium scents, curated for those who demand excellence.</p>
    <div class="timer">STAY TUNED</div>
  </div>
</div>

<script>
  function showComingSoon() {
    const el = document.getElementById('comingSoon');
    el.classList.add('active');
  }
  function closeOverlay(e) {
    if (!e || e.target === document.getElementById('comingSoon')) {
      document.getElementById('comingSoon').classList.remove('active');
    }
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeOverlay();
  });
</script>

</body>
</html>
